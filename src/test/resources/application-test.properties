# Test configuration for Order Service
spring.application.name=order-service-test

# Use H2 in-memory database for testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=test
spring.datasource.password=test

# JPA/Hibernate properties for testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT Configuration (dummy values for testing)
jwt.secret=dGVzdC1zZWNyZXQtZm9yLXRlc3RpbmctcHVycG9zZXMtb25seQ==
jwt.expiration=3600000

# Service URLs (mock values for testing)
coupon-service.url=http://localhost:8083
menu.service.url=http://localhost:8081
table.service.url=http://localhost:8085
order-service.url=http://localhost:8082

# Disable RabbitMQ for tests
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ Exchange and Queue Configuration (test values)
app.rabbitmq.exchange.table-events=test.table.events.exchange
app.rabbitmq.queue.order-service.for-table-events=test.order-service.table-events.queue
app.rabbitmq.routing-key.table.event.deleted=test.table.event.deleted
app.rabbitmq.routing-key.table.event.updated.nomor=test.table.event.updated.nomor

app.rabbitmq.exchange.order-events=test.order.events.exchange
app.rabbitmq.routing-key.order.event.created=test.order.event.created
app.rabbitmq.routing-key.order.event.updated=test.order.event.updated
app.rabbitmq.routing-key.order.event.completed=test.order.event.completed

server.port=1
