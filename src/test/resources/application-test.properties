# Test Datasource Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate properties for H2 tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Ensure JPA uses the test datasource
spring.jpa.defer-datasource-initialization=true

# No need for spring.profiles.active=test here as @ActiveProfiles on test classes handles it 