spring.application.name=order-service
server.port=${SERVER_PORT:8082}

# Database configuration - using environment variables for Neon PostgreSQL
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}/${PGDATABASE:postgres}?sslmode=require
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Admin user configuration - use environment variable in production
app.admin.password=${ADMIN_PASSWORD:secureDefaultPassword123!}

# Frontend URL configuration for CORS
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}

app.rabbitmq.exchange.table-events=table.events.exchange
app.rabbitmq.queue.order-service.for-table-events=order-service.table-events.queue
app.rabbitmq.routing-key.table.event.deleted=table.event.deleted
app.rabbitmq.routing-key.table.event.updated.nomor=table.event.updated.nomor

app.rabbitmq.exchange.order-events=order.events.exchange
app.rabbitmq.routing-key.order.event.created=order.event.created
app.rabbitmq.routing-key.order.event.updated=order.event.updated
app.rabbitmq.routing-key.order.event.completed=order.event.completed

coupon-service.url=http://localhost:8083
menu.service.url=http://localhost:8081
table.service.url=http://localhost:8085
order-service.url=http://localhost:8082

# Actuator configuration for Prometheus monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true