spring.application.name=order-service-rizzerve
server.port=8080
# Default Spring Datasource properties (can be overridden by .env via DatabaseConfig)
spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hikari Connection Pool (optional, Spring Boot provides good defaults)
# spring.datasource.hikari.connection-timeout=20000
# spring.datasource.hikari.maximum-pool-size=10 
# spring.datasource.hikari.minimum-idle=5
# spring.datasource.hikari.idle-timeout=300000

# JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Explicitly set dialect for production/main profile if not relying purely on .env
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Disable open in view pattern for performance and to prevent lazy loading issues in views
spring.jpa.open-in-view=false

# Register the EnvLoader if you were to use it (currently Dotenv is in main method)
# context.initializer.classes=id.ac.ui.cs.advprog.orderservice.config.EnvLoader

# Logging levels (examples)
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=3600000

# Menu Service Integration
menu.service.url=http://localhost:8081

# Table Service Integration
table.service.url=http://localhost:8085
