spring.application.name=order-service

# Default Spring Datasource properties (can be overridden by .env via DatabaseConfig)
spring.datasource.url=jdbc:postgresql://localhost:5432/ordersdb
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool (optional, Spring Boot provides good defaults)
# spring.datasource.hikari.connection-timeout=20000
# spring.datasource.hikari.maximum-pool-size=10 
# spring.datasource.hikari.minimum-idle=5
# spring.datasource.hikari.idle-timeout=300000

# JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Explicitly set dialect for production/main profile if not relying purely on .env
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Disable open in view pattern for performance and to prevent lazy loading issues in views
spring.jpa.open-in-view=false

# Register the EnvLoader if you were to use it (currently Dotenv is in main method)
# context.initializer.classes=id.ac.ui.cs.advprog.orderservice.config.EnvLoader

# Logging levels (examples)
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

